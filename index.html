<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Латинский язык: лексический минимум №3</title>
<style>
:root{--bg:#eef1f5;--paper:#fff;--ink:#1b2433;--muted:#647084;--line:#d5dce6;--accent:#2f5bd3;--soft:#e3eafc;--ok:#1f8a5b;--oksoft:#dff3e9;--warn:#b4532a;--warnsoft:#fbe9df}
@media(prefers-color-scheme:dark){:root{--bg:#12161d;--paper:#1b212b;--ink:#e7ecf3;--muted:#9aa6b8;--line:#2c3543;--accent:#8ba5ff;--soft:#25304c;--ok:#67d3a0;--oksoft:#173327;--warn:#f09a74;--warnsoft:#3a2219}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:720px;margin:auto;padding:20px 16px 48px}h1{font-size:1.55rem;margin:0 0 5px}.sub,.tips{color:var(--muted);font-size:.9rem}.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);padding:4px;border-radius:12px;margin:18px 0}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px 6px;border-radius:9px;font-weight:650}.tabs button.on{background:var(--accent);color:white}
.progress{margin:0 0 12px}.track{height:7px;background:var(--line);border-radius:10px;overflow:hidden}.fill{height:100%;background:var(--ok)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-bottom:6px}
.card,.item{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:22px 20px}.card{min-height:260px;display:flex;flex-direction:column;gap:14px;cursor:pointer}.tag{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.word{font-size:1.6rem;font-weight:750;line-height:1.25}.latin{font-size:1.5rem;font-weight:750;color:var(--accent)}.hint{margin-top:auto;color:var(--muted);font-size:.88rem}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:13px;border-radius:11px;font-weight:650;font-size:1rem}.again{background:var(--warnsoft);color:var(--warn);border:0}.know{background:var(--oksoft);color:var(--ok);border:0}
.forms{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.blank{min-width:82px;min-height:52px;border:2px dashed var(--accent);background:var(--soft);color:transparent;border-radius:11px;padding:12px;text-align:center;font-size:1.15rem;font-weight:700;cursor:pointer}.blank.open{color:var(--ink);background:var(--oksoft);border-style:solid;border-color:var(--ok)}.blank.lock{opacity:.48}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:var(--paper);color:var(--ink);font-size:1rem;margin-bottom:12px}.list{display:flex;flex-direction:column;gap:9px}.item h3{margin:0 0 6px;font-size:1.08rem}.item p{margin:0;font-size:1.05rem}.item b{color:var(--accent)}.reset{border:0;background:none;color:var(--accent);padding:0}@media(max-width:440px){.word,.latin{font-size:1.35rem}}
</style></head><body><div class="wrap">
<h1>Латинский язык: лексический минимум № 3</h1><p class="sub">Прилагательные 1-й группы · 55 слов</p>
<div class="tabs"><button data-m="cards">Карточки</button><button data-m="cloze">Пропуски</button><button data-m="list">Шпаргалка</button></div><main id="view"></main>
</div><script>
const D=[["слуховой (проход, отверстие и др.)", "acusticus", "a", "um", "acusticus, a, um"], ["жировой, жирный", "adiposus", "a", "um", "adiposus, a, um"], ["белый", "albus", "a", "um", "albus, a, um"], ["артериальный", "arteriosus", "a", "um", "arteriosus, a, um"], ["шероховатый", "asper", "ĕra", "ĕrum", "asper, ĕra, ĕrum"], ["слуховой (труба и др.)", "auditivus", "a", "um", "auditivus, a, um"], ["слепой", "caecus", "a", "um", "caecus, a, um"], ["сердечный", "cardiăcus", "a", "um", "cardiăcus, a, um"], ["пещеристый", "cavernosus", "a", "um", "cavernosus, a, um"], ["полый", "cavus", "a", "um", "cavus, a, um"], ["огибающий", "circumflexus", "a", "um", "circumflexus, a, um"], ["венечный", "coronarius", "a", "um", "coronarius, a, um"], ["кожный", "cutáneus", "a", "um", "cutáneus, a, um"], ["правый", "dexter", "tra", "trum", "dexter, tra, trum"], ["твёрдый", "durus", "a", "um", "durus, a, um"], ["наружный", "externus", "a", "um", "externus, a, um"], ["фиброзный / волокнистый", "fibrosus", "a", "um", "fibrosus, a, um"], ["печёночный", "hepaticus", "a", "um", "hepaticus, a, um"], ["подвздошный", "iliăcus", "a", "um", "iliăcus, a, um"], ["внутренний", "internus", "a", "um", "internus, a, um"], ["межкостный", "interosseus", "a", "um", "interosseus, a, um"], ["седалищный", "ischiadicus", "a", "um", "ischiadicus, a, um"], ["гортанный", "laryngēus", "a", "um", "laryngēus, a, um"], ["широкий", "latus", "a", "um", "latus, a, um"], ["свободный", "liber", "ĕra", "ĕrum", "liber, ĕra, ĕrum"], ["длинный", "longus", "a", "um", "longus, a, um"], ["большой", "magnus", "a", "um", "magnus, a, um"], ["жевательный", "massetericus", "a", "um", "massetericus, a, um"], ["сосцевидный", "mastoideus", "a", "um", "mastoideus, a, um"], ["средний", "medius", "a", "um", "medius, a, um"], ["нервный", "nervosus", "a", "um", "nervosus, a, um"], ["чёрный", "niger", "gra", "grum", "niger, gra, grum"], ["косой", "oblīquus", "a", "um", "oblīquus, a, um"], ["костный", "osseus", "a", "um", "osseus, a, um"], ["нёбный", "palatinus", "a", "um", "palatinus, a, um"], ["нёбно-язычный", "palatoglossus", "a", "um", "palatoglossus, a, um"], ["маленький", "parvus", "a", "um", "parvus, a, um"], ["каменистый", "petrosus", "a", "um", "petrosus, a, um"], ["глоточный", "pharyngēus", "a", "um", "pharyngēus, a, um"], ["глубокий", "profundus", "a", "um", "profundus, a, um"], ["крыловидный", "pterygoideus", "a", "um", "pterygoideus, a, um"], ["прямой", "rectus", "a", "um", "rectus, a, um"], ["красный", "ruber", "bra", "brum", "ruber, bra, brum"], ["крестцовый (кость)", "sacer", "cra", "crum", "sacer, cra, crum"], ["левый", "sinister", "tra", "trum", "sinister, tra, trum"], ["чешуйчатый", "squamоsus", "a", "um", "squamоsus, a, um"], ["подкожный", "subcutáneus", "a", "um", "subcutáneus, a, um"], ["подсухожильный", "subtendíneus", "a", "um", "subtendíneus, a, um"], ["грудной", "thoracicus", "a", "um", "thoracicus, a, um"], ["щитовидный", "thyreoideus / thyroideus", "a", "um", "thyreoideus / thyroideus, a, um"], ["поперечный", "transversus", "a", "um", "transversus, a, um"], ["трапециевидный", "trapezoideus", "a", "um", "trapezoideus, a, um"], ["мочевой", "urinarius", "a", "um", "urinarius, a, um"], ["венозный", "venosus", "a", "um", "venosus, a, um"], ["скуловой", "zygomaticus", "a", "um", "zygomaticus, a, um"]];
const $=s=>document.querySelector(s), view=$("#view");
const load=(k,d)=>{try{let v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let mode=load("lat-mode","cards"), known=new Set(load("lat-known",[])), queue=[],pos=0,flip=false,ci=0,q="";
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function build(){queue=D.map((_,i)=>i).filter(i=>!known.has(i));pos=0;flip=false}
function tabs(){document.querySelectorAll("[data-m]").forEach(b=>b.classList.toggle("on",b.dataset.m===mode))}
function prog(){let k=known.size;return `<div class="progress"><div class="meta"><span>Запомнено ${k} из ${D.length}</span><button class="reset" id="reset">Начать заново</button></div><div class="track"><div class="fill" style="width:${k/D.length*100}%"></div></div></div>`}
function render(){tabs(); if(mode==="cards")cards();else if(mode==="cloze")cloze();else list();let r=$("#reset");if(r)r.onclick=()=>{known.clear();save("lat-known",[]);build();render()}}
function cards(){
 if(!queue.length){view.innerHTML=prog()+`<div class="card"><div class="word">Все карточки выучены ✓</div><div class="hint">Можно перейти в «Пропуски» или начать заново.</div></div>`;return}
 let ix=queue[pos],d=D[ix];
 view.innerHTML=prog()+`<div class="card" id="card"><span class="tag">Карточка ${D.length-queue.length+1} · осталось ${queue.length}</span><div class="word">${esc(d[0])}</div>${flip?`<div class="latin">${esc(d[4])}</div>`:`<div class="hint">Вспомни латинскую форму и нажми на карточку.</div>`}</div>`+(flip?`<div class="actions"><button class="btn again" id="again">Ещё раз</button><button class="btn know" id="know">Помню</button></div>`:`<div class="actions"><button class="btn" id="skip">Пропустить</button><button class="btn" id="show">Показать</button></div>`);
 let f=()=>{if(!flip){flip=true;cards()}};$("#card").onclick=f;
 if(flip){$("#know").onclick=()=>{known.add(ix);save("lat-known",[...known]);queue.splice(pos,1);if(pos>=queue.length)pos=0;flip=false;cards()};$("#again").onclick=()=>{queue.push(queue.splice(pos,1)[0]);flip=false;cards()}}
 else{$("#show").onclick=f;$("#skip").onclick=()=>{queue.push(queue.splice(pos,1)[0]);cards()}}
}
function cloze(){
 let d=D[ci]; view.innerHTML=`<p class="tips">Дано слово по-русски. Открывай формы строго по порядку: первая → вторая → третья.</p><div class="card" style="cursor:default"><span class="tag">${ci+1} из ${D.length}</span><div class="word">${esc(d[0])}</div><div class="forms"><button class="blank" data-i="1">${esc(d[1])}</button><button class="blank lock" data-i="2">${esc(d[2])}</button><button class="blank lock" data-i="3">${esc(d[3])}</button></div><div class="hint">Нажми на первый пропуск, затем на второй и третий.</div></div><div class="actions"><button class="btn" id="prev">← Назад</button><button class="btn know" id="next">Дальше →</button></div>`;
 let bs=[...document.querySelectorAll(".blank")], opened=0;
 bs.forEach((b,j)=>b.onclick=()=>{if(j===opened){b.classList.add("open");b.classList.remove("lock");opened++;if(bs[opened])bs[opened].classList.remove("lock")}});
 $("#next").onclick=()=>{ci=(ci+1)%D.length;cloze()};$("#prev").onclick=()=>{ci=(ci-1+D.length)%D.length;cloze()};
}
function list(){
 view.innerHTML=`<input class="search" id="search" placeholder="Поиск по русскому или латинскому…" value="${esc(q)}"><div class="list" id="lst"></div>`;
 const draw=()=>{let t=q.toLowerCase().trim(),a=D.filter(d=>!t||(d[0]+" "+d[4]).toLowerCase().includes(t));$("#lst").innerHTML=a.map(d=>`<article class="item"><h3>${esc(d[0])}</h3><p><b>${esc(d[4])}</b></p></article>`).join("")};
 $("#search").oninput=e=>{q=e.target.value;draw()};draw();
}
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;save("lat-mode",mode);render()});
build();render();
</script></body></html>
